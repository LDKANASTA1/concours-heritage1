<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les 7 options - Concours des Ambassadeurs - HERITAGE 1</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div id="entete-racine"></div>

<section class="section">
  <div class="conteneur">
    <div class="centre-texte" style="margin-bottom:24px;">
      <h2>Les 7 options du Complexe Scolaire HERITAGE 1</h2>
      <p class="texte-att">Chaque option élit son propre ambassadeur, qui concourra ensuite pour devenir Grand Ambassadeur de la Promotion.</p>
    </div>

    <div class="grille grille--options" id="grille-options">
      <div class="squelette" style="height:120px;"></div>
      <div class="squelette" style="height:120px;"></div>
      <div class="squelette" style="height:120px;"></div>
    </div>
  </div>
</section>

<div id="pied-racine"></div>

<script>window.HERITAGE1_API_URL = "http://localhost:8000";</script>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    try {
      const options = await Api.get("/api/users/options");
      document.getElementById("grille-options").innerHTML = options.map(o => `
        <a href="option-detail.html?code=${o.code}" class="carte anim-entree" style="text-align:center;text-decoration:none;">
          <i class="fa-solid fa-ribbon" style="color:var(--degrade-fin);font-size:1.6rem;"></i>
          <h3 style="margin:10px 0 4px;">${o.nom}</h3>
          <span class="badge">${o.code}</span>
        </a>
      `).join("");
    } catch (err) {
      document.getElementById("grille-options").innerHTML = `<p class="texte-att">${err.message}</p>`;
    }
  });
</script>
</body>
</html>
