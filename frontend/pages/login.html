<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion - Concours des Ambassadeurs - HERITAGE 1</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div id="entete-racine"></div>

<section class="section" style="max-width:460px;margin:0 auto;">
  <div class="conteneur">
    <div class="carte anim-entree">
      <div class="centre-texte" style="margin-bottom:20px;">
        <i class="fa-solid fa-award" style="font-size:2rem;color:var(--degrade-fin);"></i>
        <h2>Connexion</h2>
        <p class="texte-att">Accède à ton espace candidat.</p>
      </div>

      <form id="form-connexion" novalidate>
        <div class="champ">
          <label for="numero">Numéro de téléphone</label>
          <input type="tel" id="numero" name="numero" placeholder="08XXXXXXXX ou +243XXXXXXXXX" required>
        </div>
        <div class="champ">
          <label for="pin">Code PIN (4 chiffres)</label>
          <input type="password" id="pin" name="pin" inputmode="numeric" pattern="\d{4}" maxlength="4" required>
        </div>
        <button type="submit" class="bouton bouton--principal bouton--bloc">Se connecter</button>
      </form>

      <p class="centre-texte texte-att" style="margin-top:18px;">
        Pas encore inscrit(e) ? <a href="inscription.html">Dépose ta candidature</a>
      </p>
    </div>
  </div>
</section>

<div id="pied-racine"></div>

<script>window.HERITAGE1_API_URL = "http://localhost:8000";</script>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
