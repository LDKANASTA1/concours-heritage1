<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Concours des Ambassadeurs - HERITAGE 1</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div id="entete-racine"></div>

<section class="section" style="max-width:640px;margin:0 auto;">
  <div class="conteneur">
    <div class="centre-texte" style="margin-bottom:20px;">
      <h2>Contact & support</h2>
      <p class="texte-att">Une question, un signalement, un problème technique ? Écris-nous.</p>
    </div>

    <div class="grille grille--2" style="margin-bottom:24px;">
      <a href="https://wa.me/243826740490" target="_blank" rel="noopener" class="carte centre-texte" style="text-decoration:none;">
        <i class="fa-brands fa-whatsapp" style="font-size:1.8rem;color:#25D366;"></i>
        <h3 style="margin:8px 0 0;">WhatsApp</h3>
        <p class="texte-att">+243 826 740 490</p>
      </a>
      <a href="mailto:ldkanasta@gmail.com" class="carte centre-texte" style="text-decoration:none;">
        <i class="fa-solid fa-envelope" style="font-size:1.8rem;color:var(--degrade-fin);"></i>
        <h3 style="margin:8px 0 0;">Email</h3>
        <p class="texte-att">ldkanasta@gmail.com</p>
      </a>
    </div>

    <div class="carte anim-entree">
      <form id="form-contact" novalidate>
        <div class="grille grille--2">
          <div class="champ">
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" required>
          </div>
          <div class="champ">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
        </div>
        <div class="champ">
          <label for="telephone">Téléphone (optionnel)</label>
          <input type="tel" id="telephone" name="telephone">
        </div>
        <div class="champ">
          <label for="sujet">Sujet</label>
          <input type="text" id="sujet" name="sujet" required>
        </div>
        <div class="champ">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="bouton bouton--principal bouton--bloc"><i class="fa-solid fa-paper-plane"></i> Envoyer le message</button>
      </form>
    </div>
  </div>
</section>

<div id="pied-racine"></div>

<script>window.HERITAGE1_API_URL = "http://localhost:8000";</script>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/contact.js"></script>
</body>
</html>
